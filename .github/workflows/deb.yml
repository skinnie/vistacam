# Build the .deb packages, test them on Ubuntu, Debian and Linux Mint, and
# attach them to a GitHub release when a v* tag is pushed.
name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            grep -q "^version = \"$v\"" pyproject.toml ||
              { echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml"; exit 1; }
          else
            v="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)+git$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: packaging/deb/build.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", headers: linux-headers-generic }
          - { image: "ubuntu:24.04", headers: linux-headers-generic }
          - { image: "debian:12", headers: linux-headers-amd64 }
          - { image: "linuxmintd/mint21.3-amd64", headers: linux-headers-generic }
          - { image: "linuxmintd/mint22.2-amd64", headers: linux-headers-generic }
          - { image: "linuxmintd/lmde6-amd64", headers: linux-headers-amd64 }
    container: ${{ matrix.image }}
    name: test (${{ matrix.image }})
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs
      - name: Install packages
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ${{ matrix.headers }}
          apt-get install -y -q --no-install-recommends ./*.deb
      - name: Build the driver for the distro kernel
        run: |
          kver=$(ls /lib/modules | sort -V | tail -1)
          ver="${{ needs.build.outputs.version }}"
          echo "kernel $kver"
          dkms build -m gspca-ov519-vistacam -v "$ver" -k "$kver"
          ko=$(find /var/lib/dkms/gspca-ov519-vistacam/"$ver"/"$kver" -name 'gspca_ov519.ko*' | head -1)
          modinfo "$ko" | grep -E '^(vermagic|parm)'
          modinfo "$ko" | grep -q 'creative_tuning'
      - name: Start the app (off-screen, no camera)
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 10 vistacam
          rc=$?
          [ "$rc" = 124 ] || { echo "::error::vistacam exited with $rc"; exit 1; }
      - name: Start the app on an emulated Core 2 CPU (no SSE4.2, issue #1)
        run: |
          apt-get install -y -q --no-install-recommends qemu-user
          set +e
          QT_QPA_PLATFORM=offscreen timeout 120 qemu-x86_64 -cpu Penryn /usr/bin/python3 -s -c \
            'import sys; sys.path.insert(0, "/opt/vistacam/lib"); from vistacam.window import main; sys.exit(main())'
          rc=$?
          [ "$rc" = 124 ] || { echo "::error::vistacam on Penryn exited with $rc"; exit 1; }
      - name: Remove packages
        run: apt-get remove -y -q vistacam gspca-ov519-vistacam-dkms

  # The app from source on the distro's own PyQt6 (./install.sh --system-qt).
  system-qt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "linuxmintd/mint22.2-amd64"]
    container: ${{ matrix.image }}
    name: system Qt (${{ matrix.image }})
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install PyQt6 from the distro
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends python3-pyqt6 python3-pyqt6.qtsvg \
            python3-numpy python3-venv python3-pip libqt6svg6 qt6-qpa-plugins
      - name: UI test on PyQt6
        run: QT_QPA_PLATFORM=offscreen VISTACAM_QT=pyqt6 python3 tests/ui_sweep.py
      - name: install.sh --system-qt
        run: |
          useradd -m tester
          cp -r . /home/tester/vistacam && chown -R tester /home/tester/vistacam
          su tester -c 'cd ~/vistacam && ./install.sh --system-qt'
          set +e
          su tester -c 'QT_QPA_PLATFORM=offscreen timeout 10 ~/.local/bin/vistacam'
          rc=$?
          [ "$rc" = 124 ] || { echo "::error::vistacam exited with $rc"; exit 1; }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, system-qt]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.deb --repo "$GITHUB_REPOSITORY" \
            --title "VistaCam $GITHUB_REF_NAME" --generate-notes
