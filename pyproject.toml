[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vistacam"
version = "0.1.0"
description = "Desktop app and Linux driver tuning for the Creative Live! Cam Vista IM (VF0260)"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5", "numpy>=1.23"]

[project.gui-scripts]
vistacam = "vistacam.window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vistacam = ["fonts/*", "icons/*"]
